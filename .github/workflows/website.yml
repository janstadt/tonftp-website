# Deploys the TONFTP LLC marketing site (static files at the repo root) to
# GitHub Pages.
#
# Site will be available at: https://www.tonftp.com/
# GitHub Pages URL: https://<owner>.github.io/tonftp-website/
#
# NOTE: repo Settings → Pages → Build and deployment → Source
# must be set to "GitHub Actions" (one-time setup).
name: website

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Site is plain static files at the repo root — no build step needed.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
